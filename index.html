<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JAN表記検索</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f3f6fa;
      color: #182536;
    }
    main { max-width: 560px; margin: auto; }
    h1 { font-size: 23px; margin: 6px 0 16px; }
    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #17212b;
    }
    #result {
      margin: 16px 0;
      padding: 22px 18px;
      min-height: 132px;
      border-radius: 12px;
      background: white;
    }
    #label {
      font-size: 29px;
      font-weight: 800;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    #detail { margin-top: 10px; color: #536477; }
    .error #label { color: #b42318; }
    .controls { display: flex; gap: 8px; }
    input {
      width: 100%;
      min-width: 0;
      padding: 13px;
      font-size: 18px;
      border: 1px solid #aab6c2;
      border-radius: 9px;
    }
    button {
      padding: 13px 16px;
      border: 0;
      border-radius: 9px;
      background: #003a77;
      color: white;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }
    #scanButton { width: 100%; margin-bottom: 12px; }
    small { display: block; margin-top: 12px; color: #536477; }
  </style>
</head>
<body>
  <main>
    <h1>JAN表記検索</h1>

    <button id="scanButton" type="button">カメラを起動</button>
    <div id="reader"></div>

    <div id="result" role="status" aria-live="polite">
      <div id="label">カメラを起動してください</div>
      <div id="detail"></div>
    </div>

    <div class="controls">
      <input id="janInput" type="text" inputmode="numeric"
             autocomplete="off" placeholder="JANを手入力">
      <button id="searchButton" type="button">検索</button>
    </div>

    <small>読み取った後は「次をスキャン」を押すと続けて使えます。</small>
  </main>

  <script>
    // ここをGASの「ウェブアプリURL」に変更
    const GAS_URL = 'https://script.google.com/a/macros/trial-net.co.jp/s/AKfycbyyIwW5_Xe5fwSujAPQur-EVpGrxLY-NOFxhoyh_ea3fx2NVNwK9fcR8_gigvZtSNKK/exec';
c
    const scanner = new Html5Qrcode('reader', {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128
      ],
      verbose: false
    });

    const resultBox = document.getElementById('result');
    const label = document.getElementById('label');
    const detail = document.getElementById('detail');
    const janInput = document.getElementById('janInput');
    const scanButton = document.getElementById('scanButton');

    let scanning = false;
    let busy = false;
    let requestNumber = 0;

    function show(message, subtext = '', isError = false) {
      resultBox.classList.toggle('error', isError);
      label.textContent = message;
      detail.textContent = subtext;
    }

    function lookup(jan) {
      jan = String(jan).trim();

      if (!/^\d{8,14}$/.test(jan)) {
        show('JANを確認してください', '8～14桁の数字を入力してください。', true);
        return;
      }

      janInput.value = jan;
      show('検索中…', `JAN：${jan}`);

      // GASのContentServiceは別のURLへリダイレクトされるためJSONPで受け取る
      const callbackName =
        `janCallback_${Date.now()}_${++requestNumber}`;

      const script = document.createElement('script');
      let finished = false;

      const timer = setTimeout(() => {
        finish();
        show('通信がタイムアウトしました',
             '通信状態を確認して、もう一度検索してください。', true);
      }, 15000);

      function finish() {
        if (finished) return false;
        finished = true;
        clearTimeout(timer);
        script.remove();
        delete window[callbackName];
        return true;
      }

      window[callbackName] = data => {
        if (!finish()) return;

        if (data.status === 'found') {
          show(data.label || '表記が空欄です', `JAN：${data.jan}`);
        } else {
          show(data.message || '検索できませんでした',
               data.jan ? `JAN：${data.jan}` : '', true);
        }
      };

      script.onerror = () => {
        if (!finish()) return;
        show('通信できませんでした',
             'GASのURLと公開設定を確認してください。', true);
      };

      const url = new URL(GAS_URL);
      url.searchParams.set('jan', jan);
      url.searchParams.set('callback', callbackName);
      script.src = url.toString();

      document.head.appendChild(script);
    }

    async function stopScanner() {
      if (!scanning) return;
      scanning = false;
      await scanner.stop();
      scanner.clear();
    }

    async function startScanner() {
      if (busy || scanning) return;

      busy = true;
      scanButton.disabled = true;
      show('カメラを起動しています…');

      try {
        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 280, height: 160 } },
          async decodedText => {
            if (busy) return;
            busy = true;

            try {
              await stopScanner();
              scanButton.textContent = '次をスキャン';
              lookup(decodedText);
            } catch (error) {
              show('カメラを停止できませんでした',
                   String(error), true);
            } finally {
              busy = false;
            }
          },
          () => {} // 読み取り途中の失敗は画面に出さない
        );

        scanning = true;
        show('バーコードを枠内にかざしてください');
      } catch (error) {
        show('カメラを起動できませんでした',
             'Safariのカメラ許可とHTTPS接続を確認してください。', true);
      } finally {
        busy = false;
        scanButton.disabled = false;
      }
    }

    scanButton.addEventListener('click', startScanner);

    document.getElementById('searchButton')
      .addEventListener('click', () => lookup(janInput.value));

    janInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') lookup(janInput.value);
    });
  </script>
</body>
</html>
